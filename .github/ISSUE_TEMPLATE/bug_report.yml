name: Bug report · Ошибка
description: Something does not work as it should. · Что-то работает не так.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. You can write in English or Russian. Security issues go to [SECURITY.md](https://github.com/5DHelLD5/dynamic-audio-releases/blob/main/SECURITY.md), not here.
        Спасибо! Можно писать по-русски. Об уязвимостях сообщайте приватно, как описано в SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened? · Что случилось?
      description: What you expected and what you saw instead. · Что вы ожидали и что произошло на самом деле.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce · Как повторить
      placeholder: |
        1.
        2.
        3.
  - type: input
    id: app-version
    attributes:
      label: Dynamic Audio version · Версия Dynamic Audio
      description: Settings → About. · Настройки → О программе.
      placeholder: "2.0"
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version · Версия macOS
      placeholder: "27.0"
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac model · Модель Mac
      placeholder: 'MacBook Pro 14", M1 Pro'
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else · Скриншоты и другие подробности
      description: Drag images here. Please hide anything private. · Перетащите сюда картинки. Скройте личное.
